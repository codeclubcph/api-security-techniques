version: '3.9'

services:
  wallet-api:
    build:
      context: api
      dockerfile: Dockerfile
    image: vulnerable-wallet-api:latest
    container_name: vulnerable-wallet-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
